
name: Publicar Montreal en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: output/Backend/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: output/Backend/frontend
        run: npm ci

      - name: Construir página React
        working-directory: output/Backend/frontend
        run: npm run build
        env:
          PUBLIC_URL: /mi-pagina-web

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir página construida
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/Backend/frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4

